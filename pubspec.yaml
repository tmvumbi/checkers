name: checkers
description: "Checkers — international draughts and checkers, online and vs the computer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  supabase_flutter: ^2.9.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  shared_preferences: ^2.5.5
  share_plus: ^13.1.0
  rate_my_app: ^2.3.2
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  wakelock_plus: ^1.3.3
  flutter_confetti: ^0.5.1
  flutter_html: ^3.0.0
  webview_flutter: ^4.13.1
  google_mobile_ads: ^8.0.0
  app_tracking_transparency: ^2.0.6+1
  device_info_plus: ^13.0.0
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# Launcher icon = the play screen's board-tile logo, rendered by
# tool/generate_app_icon_test.dart (rerun it after changing the mark).
flutter_launcher_icons:
  image_path: assets/icons/app_logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#12261B"
  adaptive_icon_foreground: assets/icons/app_logo_foreground.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/emotes/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Iosevka Charon
      fonts:
        - asset: assets/fonts/iosevka_charon/IosevkaCharon-Regular.ttf
          weight: 400
        - asset: assets/fonts/iosevka_charon/IosevkaCharon-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/iosevka_charon/IosevkaCharon-Medium.ttf
          weight: 500
        - asset: assets/fonts/iosevka_charon/IosevkaCharon-Bold.ttf
          weight: 700
